<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini E-Commerce</title>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .product { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .cart { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
    button { margin-left: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const products = [
      { id: 1, name: 'Produit A', price: 10 },
      { id: 2, name: 'Produit B', price: 15 },
      { id: 3, name: 'Produit C', price: 20 }
    ];

    function ProductList({ onAdd }) {
      return (
        <div>
          <h2>Produits</h2>
          {products.map(p => (
            <div key={p.id} className="product">
              {p.name} - {p.price}€
              <button onClick={() => onAdd(p)}>Ajouter au panier</button>
            </div>
          ))}
        </div>
      );
    }

    function Cart({ items, onPay }) {
      const total = items.reduce((sum, item) => sum + item.price, 0);
      return (
        <div className="cart">
          <h2>Panier</h2>
          {items.length === 0 && <p>Panier vide</p>}
          <ul>
            {items.map((item, index) => (
              <li key={index}>{item.name} - {item.price}€</li>
            ))}
          </ul>
          {items.length > 0 && (
            <div>
              <strong>Total: {total}€</strong>
              <button onClick={onPay}>Payer</button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [cart, setCart] = React.useState([]);

      const addToCart = product => {
        setCart([...cart, product]);
      };

      const handlePay = () => {
        alert('Paiement fictif effectué!');
        setCart([]);
      };

      return (
        <div>
          <h1>Mini E-Commerce</h1>
          <ProductList onAdd={addToCart} />
          <Cart items={cart} onPay={handlePay} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
